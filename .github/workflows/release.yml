name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, name: macos-arm64, ext: tar.gz }
          - { os: macos-14, target: x86_64-apple-darwin, name: macos-x64, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64, ext: zip }
          # Compiles via the "unsupported OS" fallbacks in apps.rs/lock.rs/install.rs: pairing,
          # stats and the terminal work, but there's no app list, lock, or auto-start yet.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x64, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Test
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p remotectl -p remotectl-relay --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          d=remotectl-${{ github.ref_name }}-${{ matrix.name }}
          mkdir "$d"
          cp target/${{ matrix.target }}/release/remotectl target/${{ matrix.target }}/release/remotectl-relay LICENSE README.md "$d/"
          tar czf "$d.tar.gz" "$d"
      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $d = "remotectl-${{ github.ref_name }}-${{ matrix.name }}"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target/${{ matrix.target }}/release/remotectl.exe, target/${{ matrix.target }}/release/remotectl-relay.exe, LICENSE, README.md $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: remotectl-*.${{ matrix.ext }}

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
